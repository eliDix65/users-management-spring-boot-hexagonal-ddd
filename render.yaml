services:
  - type: web
    name: users-management-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /v3/api-docs
    envVars:
      # Motor de base de datos. TiDB Serverless es compatible con MySQL: este valor
      # es obligatorio declararlo aqui porque si no, Render conservaria el
      # DB_VENDOR=postgresql del blueprint anterior (Supabase) y la app fallaria
      # al iniciar con "An error occurred while setting up the SSL connection".
      - key: DB_VENDOR
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: crud_usuarios
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # TiDB exige TLS y el proyecto soporta VERIFY_IDENTITY (certificado validado).
      - key: DB_SSL_MODE
        sync: false
      # Clave API REST de Brevo. Render bloquea los puertos SMTP salientes (25/587/465),
      # por eso el envio se hace contra https://api.brevo.com (HTTPS 443).
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_ADDRESS
        sync: false
      - key: BREVO_FROM_NAME
        value: Gestion de Usuarios
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_SECONDS
        sync: false
